name: Platform validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sml
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: sml
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sml"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r backend/requirements.txt pip-audit bandit
      - run: python scripts/validate_sources.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests_backend -v
      - name: PostgreSQL integration and authorization
        env:
          SML_TEST_POSTGRES_URL: postgresql://sml:ci-synthetic-only@127.0.0.1:5432/sml
        run: python -m unittest discover -s tests_backend -v
      - name: PostgreSQL backup and restore drill
        env:
          SML_ENV: test
          SML_TEST_POSTGRES_URL: postgresql://sml:ci-synthetic-only@127.0.0.1:5432/sml
        run: |
          python scripts/seed_restore_fixture.py
          docker exec ${{ job.services.postgres.id }} pg_dump -U sml -d sml > /tmp/sml-backup.sql
          docker exec ${{ job.services.postgres.id }} createdb -U sml sml_restore
          docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U sml -d sml_restore < /tmp/sml-backup.sql
          test "$(docker exec ${{ job.services.postgres.id }} psql -U sml -d sml_restore -Atc 'SELECT count(*) FROM schema_versions')" = "2"
          test "$(docker exec ${{ job.services.postgres.id }} psql -U sml -d sml_restore -Atc "SELECT concat(t.score,'/',t.total,':',r.evidence_count,':',r.decision_supported) FROM attempts t JOIN recovery_attempts r ON r.attempt_id=t.id JOIN recovery_assignments a ON a.assignment_id=t.assignment_id WHERE t.id='00000000-0000-4000-8000-000000000005' AND a.case_id='builder'")" = "4/5:3:1"

      - run: python -m pip_audit -r backend/requirements.txt
      - run: python -m bandit -r backend -q
      - run: npm ci --prefix web --ignore-scripts
      - run: npm audit --prefix web --audit-level=moderate
      - run: node --test tests_web/*.test.mjs
      - run: npm run build --prefix web
      - run: python scripts/package_web.py
      - run: npx --prefix web playwright install --with-deps chromium
      - name: Browser journeys
        run: |
          python -m http.server 8070 --bind 127.0.0.1 --directory web/dist &
          NODE_PATH="$PWD/web/node_modules" node scripts/browser-check.cjs
          NODE_PATH="$PWD/web/node_modules" node scripts/mission-check.cjs
          NODE_PATH="$PWD/web/node_modules" node scripts/troubleshooting-check.cjs
          NODE_PATH="$PWD/web/node_modules" node scripts/offline-check.cjs
      - name: Connected learning browser journeys
        run: |
          NODE_PATH="$PWD/web/node_modules" node scripts/connected-check.cjs
      - name: Build non-root application image
        run: docker build -f deploy/Dockerfile.api -t sml-api:test .
      - name: Verify constrained container and response headers
        run: |
          docker run -d --name sml-api-check --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 256m -e SML_SERVE_WEB=1 sml-api:test
          docker exec sml-api-check python -c "import urllib.request,time; time.sleep(2); r=urllib.request.urlopen('http://127.0.0.1:8080/health'); assert r.status==200; assert r.headers['Cache-Control']=='no-store'; r=urllib.request.urlopen('http://127.0.0.1:8080/'); assert b'Signal Mission Lab' in r.read(); assert 'script-src' in r.headers['Content-Security-Policy']"
          docker rm -f sml-api-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-evidence
          path: artifacts/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: web/dist
