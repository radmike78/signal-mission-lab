name: Platform validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r backend/requirements.txt pip-audit
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests_backend -v
      - run: python -m pip_audit -r backend/requirements.txt
      - run: npm ci --prefix web --ignore-scripts
      - run: npm audit --prefix web --audit-level=moderate
      - run: npm run build --prefix web
      - run: python scripts/package_web.py
      - run: npx --prefix web playwright install --with-deps chromium
      - name: Browser journeys
        run: |
          python -m http.server 8070 --bind 127.0.0.1 --directory web/dist &
          NODE_PATH="$PWD/web/node_modules" node scripts/browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-evidence
          path: artifacts/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: web/dist
