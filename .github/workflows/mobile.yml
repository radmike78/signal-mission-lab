name: Mobile preparation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci --prefix web --ignore-scripts
      - run: python scripts/prepare_mobile.py android
      - name: Compile APK and unsigned release bundle
        working-directory: web/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease
      - run: python scripts/verify_mobile_build.py android
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-builds
          path: |
            web/android/app/build/outputs/apk/debug/*.apk
            web/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select installed Xcode 26 or newer
        run: |
          XCODE_PATH=$(python3 -c 'import glob,re; paths=[p for p in glob.glob("/Applications/Xcode*.app") if re.search(r"Xcode_(2[6-9]|[3-9][0-9])",p)]; assert paths,"Xcode 26+ required"; print(sorted(paths,key=lambda p:[int(x) for x in re.findall(r"\d+",p)])[-1])')
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - run: npm ci --prefix web --ignore-scripts
      - run: python scripts/prepare_mobile.py ios
      - name: Compile unsigned iOS simulator app
        run: xcodebuild -project web/ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath artifacts/ios CODE_SIGNING_ALLOWED=NO build
      - run: python scripts/verify_mobile_build.py ios
      - name: Preserve simulator app bundle
        run: ditto -c -k --keepParent artifacts/ios/Build/Products/Debug-iphonesimulator/App.app artifacts/ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-build
          path: artifacts/ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
